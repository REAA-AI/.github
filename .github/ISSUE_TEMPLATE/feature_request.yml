name: 💡 Feature Request
description: Capture something a client or user needs — no technical knowledge required!
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Capturing a client need 🎯

        Fill this out in your own words based on what the client or user needs.
        Even one sentence per box is perfectly fine — the team will follow up on any details.

  - type: input
    id: who
    attributes:
      label: Who is this for?
      description: Which client or type of user needs this?
      placeholder: "Example: Acme Corp — their warehouse staff."
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: What do they need?
      description: Describe what the client or user wants to be able to do, in plain words.
      placeholder: "Example: They want to download their monthly report as a PDF."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Why do they need it?
      description: What's hard or frustrating for them today that this would solve?
      placeholder: "Example: Right now they copy the numbers by hand, which is slow and error-prone."
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Add a screenshot, a link, or any other detail. Skip this if you're not sure.
      placeholder: "You can paste a screenshot by dragging an image into the box."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to the client? (optional)
      options:
        - "Nice to have"
        - "Would really help them"
        - "They really need this"
      default: 0
    validations:
      required: false
